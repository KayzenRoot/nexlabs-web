name: Bug report
description: Report a reproducible website or governance defect
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed defect and expected behavior.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Exact commit
      description: Provide the candidate SHA where the behavior was observed.
    validations:
      required: true
