<!doctype html>
<meta charset="utf-8">
<title>CP06 static fallback contact sheet</title>
<style>
  body { margin: 0; padding: 24px; background: #10151c; color: #d9f4ff; font: 16px system-ui, sans-serif; }
  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  figure { margin: 0; padding: 12px; background: #1b2b3d; border: 1px solid #4b718b; }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding-top: 8px; }
</style>
<main>
  <figure><img src="hero-16x9.png" alt="CP06 hero 16 by 9"><figcaption>Hero 16:9</figcaption></figure>
  <figure><img src="hero-4x5.png" alt="CP06 hero 4 by 5"><figcaption>Hero 4:5</figcaption></figure>
  <figure><img src="hero-1x1.png" alt="CP06 hero square"><figcaption>Hero 1:1</figcaption></figure>
</main>
